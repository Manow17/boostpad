<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Boostpad overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 600 15px "Segoe UI", system-ui, sans-serif; color: #fff; }
    #root { transform-origin: top right; position: absolute; top: 0; right: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding: 8px; }
    #mmr { background: rgba(10, 12, 18, .72); border-radius: 10px; padding: 6px 14px; text-align: right; }
    #mmr b { font-size: 26px; display: block; line-height: 1.1; }
    #mmr span { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }
    svg { display: block; }
    .body { fill: var(--pad); stroke: var(--edge); stroke-width: 2; }
    .btn { fill: var(--key); stroke: var(--edge); stroke-width: 1.5; transition: fill .04s; }
    .on { fill: var(--accent); }
    .stick { fill: var(--edge); }
    body.light { --pad: rgba(240, 242, 247, .92); --key: #c9ced9; --edge: #5b6272; }
    body.dark { --pad: rgba(22, 25, 33, .92); --key: #3a4150; --edge: #9aa3b5; }
  </style>
</head>
<body class="light">
  <div id="root">
    <div id="mmr" hidden><b></b><span></span></div>
    <svg id="pad" hidden width="300" height="190" viewBox="0 0 300 190">
      <rect class="btn" id="b6" x="48" y="6" width="50" height="16" rx="6"/>
      <rect class="btn" id="b7" x="202" y="6" width="50" height="16" rx="6"/>
      <rect class="btn" id="b4" x="44" y="26" width="58" height="12" rx="6"/>
      <rect class="btn" id="b5" x="198" y="26" width="58" height="12" rx="6"/>
      <path class="body" d="M60 42h180c26 0 44 30 50 80 5 40-6 62-26 62-18 0-26-18-40-40H76c-14 22-22 40-40 40-20 0-31-22-26-62 6-50 24-80 50-80z"/>
      <rect class="btn" id="b12" x="68" y="60" width="14" height="16" rx="3"/>
      <rect class="btn" id="b13" x="68" y="90" width="14" height="16" rx="3"/>
      <rect class="btn" id="b14" x="52" y="76" width="16" height="14" rx="3"/>
      <rect class="btn" id="b15" x="82" y="76" width="16" height="14" rx="3"/>
      <circle class="btn" id="b3" cx="225" cy="64" r="9"/>
      <circle class="btn" id="b0" cx="225" cy="102" r="9"/>
      <circle class="btn" id="b2" cx="206" cy="83" r="9"/>
      <circle class="btn" id="b1" cx="244" cy="83" r="9"/>
      <rect class="btn" id="b8" x="118" y="62" width="18" height="9" rx="4"/>
      <rect class="btn" id="b9" x="164" y="62" width="18" height="9" rx="4"/>
      <circle class="btn" id="b10" cx="110" cy="124" r="20"/>
      <circle class="btn" id="b11" cx="190" cy="124" r="20"/>
      <circle class="stick" id="ls" cx="110" cy="124" r="9"/>
      <circle class="stick" id="rs" cx="190" cy="124" r="9"/>
    </svg>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
