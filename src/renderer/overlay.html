<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>OpenW controller overlay</title>
  <style>
    @font-face { font-family: "Outfit"; src: url("../../assets/fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #pad { width: 100%; height: 100%; box-sizing: border-box; padding: 4px; }
    /* "Move overlays": the window can be dragged and shows where it is */
    body.edit { -webkit-app-region: drag; cursor: move; outline: 2px dashed #00d8c8; outline-offset: -2px; border-radius: 14px; background: rgba(14, 15, 18, .45); }
    body.edit::after { content: "Drag to move"; position: absolute; left: 50%; bottom: 8px; translate: -50% 0; padding: 3px 10px; border-radius: 8px; background: #00d8c8; color: #03211f; font: 600 12px "Outfit", sans-serif; }
  </style>
</head>
<body>
  <div id="pad"></div>
  <script src="../../assets/controllers/pads.js"></script>
  <script src="pad.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
