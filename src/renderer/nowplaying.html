<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Boostpad now playing</title>
  <style>
    @font-face { font-family: "Outfit"; src: url("../../assets/fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "DM Sans"; src: url("../../assets/fonts/dm-sans.woff2") format("woff2"); font-weight: 100 1000; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f1f2f4; font: 13px/1.3 "DM Sans", "Segoe UI", sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    /* drawn at 400x70 and scaled to the window, so the size setting scales everything */
    #stage { width: 400px; height: 70px; flex: none; display: flex; justify-content: center; align-items: center; transform-origin: center; }
    #pill { position: relative; display: flex; align-items: center; gap: 11px; height: 52px; max-width: 360px; min-width: 220px; padding: 0 16px 0 7px; box-sizing: border-box;
      border-radius: 16px; background: rgba(14, 15, 18, .86); border: 1px solid rgba(255, 255, 255, .09); overflow: hidden;
      transition: opacity .45s, transform .45s cubic-bezier(.2, .8, .2, 1); }
    #pill.off { opacity: 0; transform: translateY(-14px); }
    #pill.paused { opacity: .6; }
    #art { width: 38px; height: 38px; border-radius: 10px; background: #2b2e35 center / cover; flex: none; }
    #text { min-width: 0; display: flex; flex-direction: column; }
    #title { font: 600 13.5px/1.25 "Outfit", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #artist { color: #9da2ad; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #text.change > * { animation: change .5s cubic-bezier(.2, .8, .2, 1); }
    @keyframes change { from { opacity: 0; transform: translateY(8px); } }
    #eq { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; margin-left: 4px; flex: none; }
    #eq i { width: 3px; border-radius: 2px; background: #00d8c8; height: 30%; animation: eq 1s ease-in-out infinite; }
    #eq i:nth-child(2) { animation-delay: -.35s; } #eq i:nth-child(3) { animation-delay: -.7s; }
    #pill.paused #eq i { animation-play-state: paused; }
    @keyframes eq { 50% { height: 100%; } }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, .08); }
    #bar i { display: block; height: 100%; width: 0; background: #00d8c8; transition: width 1s linear; }
    /* "Move overlays": the window can be dragged and shows where it is */
    body.edit { -webkit-app-region: drag; cursor: move; outline: 2px dashed #00d8c8; outline-offset: -2px; border-radius: 14px; background: rgba(14, 15, 18, .45); }
    body.edit #pill.off { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pill" class="off">
      <div id="art"></div>
      <div id="text"><span id="title"></span><span id="artist"></span></div>
      <div id="eq"><i></i><i></i><i></i></div>
      <div id="bar"><i></i></div>
    </div>
  </div>
  <script src="nowplaying.js"></script>
</body>
</html>
